<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Settlement</title>
<link rel="stylesheet" href="/shared/ledger.css">
<link rel="stylesheet" href="/shared/paper.css">
<link rel="stylesheet" href="/shared/encounter-cards.css">
<style>
  /* The table screen: one thing at a time, held up to the light.
     Projected in front of everyone — no chrome, no controls. */
  /* The same warm, dark room as the login and the player shell: a brass glow
     at the top, a slow diagonal gradient and fine vertical grain. */
  html { height: 100%; background: #130f0b; }
  body {
    height: 100%; margin: 0;
    background:
      radial-gradient(ellipse at 50% -8%, rgba(143, 103, 56, 0.17), transparent 42%),
      linear-gradient(115deg, #130f0b, #211a14 24%, #1d1711 76%, #110d0a);
    color: #e8dfcc;
    overflow: hidden;
    cursor: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(92deg, transparent 0 170px, rgba(255, 255, 255, 0.008) 171px, transparent 172px),
      radial-gradient(ellipse at 50% 65%, rgba(170, 120, 57, 0.07), transparent 48%);
  }
  #stage { position: relative; }
  /* The stage's class is namespaced (view-card, view-rule, ...): the shared
     ledger stylesheet has its own .card and .rule, which once painted the whole
     projected screen cream. */
  #stage {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    padding: 3vh 4vw;
    text-align: center;
    animation: appear 0.9s ease both;
  }
  @keyframes appear {
    from { opacity: 0; transform: scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  .smallcaps { color: #a89877; }

  /* idle */
  .idle-name { font-size: clamp(2.2rem, 6vw, 4.5rem); letter-spacing: 0.03em; }
  .idle-season { font-size: clamp(1rem, 2.2vw, 1.5rem); }

  /* image */
  #stage.view-image { padding: 0; gap: 0; position: relative; }
  #stage.view-image img {
    max-width: 100vw; max-height: 100vh;
    object-fit: contain;
  }
  #stage.view-image .caption {
    position: absolute; bottom: 3.5vh; left: 0; right: 0;
    font-variant: small-caps; letter-spacing: 0.12em;
    color: #e8dfcc; font-size: clamp(1rem, 2vw, 1.4rem);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
  }

  /* card (folk / person / place): the whole picture, never cropped, with the
     name beneath. The image sets its own box, scaled to leave room for the name. */
  .card-portrait {
    display: block; line-height: 0; overflow: hidden;
    border-radius: 12px; border: 2px solid #6b5c42;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.6);
  }
  .card-portrait img {
    display: block; width: auto; height: auto;
    max-width: 90vw; max-height: calc(100vh - 12rem);
    object-fit: contain;
  }
  .card-portrait.wide img { max-width: min(92vw, 1200px); }
  .card-name { font-size: clamp(2rem, 5vw, 3.6rem); letter-spacing: 0.02em; }

  /* stores */
  .stores-strip { display: flex; gap: clamp(1.5rem, 5vw, 4rem); flex-wrap: wrap; justify-content: center; }
  .stores-strip .stat .value { font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 600; color: #f0e6ce; }
  .stores-strip .stat .smallcaps { font-size: clamp(0.9rem, 1.8vw, 1.2rem); }

  /* buildings */
  .b-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; width: min(1100px, 92vw); }
  .b-card {
    background: #221b12; border: 1px solid #453824; border-radius: 10px;
    padding: 1.1rem 1.3rem; text-align: left; border-top: 3px solid #667b63;
  }
  .b-card.unraised { border-top-color: #c36e3f; background: #271c13; }
  .b-card strong { font-size: 1.25rem; }
  .b-card .muted { color: #a89877; font-size: 0.95rem; }
  .b-cost { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .75rem; padding-top: .55rem; border-top: 1px solid #453824; }
  .b-cost span { width: 100%; color: #a89877; font-size: .72rem; font-variant: small-caps; }
  .b-cost b { padding: .15rem .35rem; border: 1px solid #5b4930; color: #dfcda7; font-size: .74rem; font-weight: 500; }

  /* text */
  .text-title { font-size: clamp(1.8rem, 4.5vw, 3.2rem); }
  .text-body { max-width: 820px; font-size: clamp(1.1rem, 2.4vw, 1.7rem); line-height: 1.6; white-space: pre-wrap; }
  .rule-path { font-size: clamp(.75rem, 1.4vw, 1rem); }
  .rule-body { max-width: 980px; text-align: left; }

  /* encounter */
  #stage.view-encounter { padding: 0; gap: 0; }
  .enc-title {
    position: absolute; top: 2.2vh; left: 0; right: 0; z-index: 5; pointer-events: none;
    font-variant: small-caps; letter-spacing: 0.14em; font-size: clamp(1rem, 2.2vw, 1.6rem);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
  }

  /* paper */
  #stage.view-paper { display: grid; place-items: center; padding: 2vh 3vw; }
  #stage.view-paper .paper-sheet { width: min(820px, 92vw); min-height: min(760px, 94vh); max-height: 96vh; overflow-x: hidden; overflow-y: auto; text-align: left; }

  .divider {
    border: 0; height: 1px; width: min(360px, 50vw);
    background: linear-gradient(90deg, transparent, #6b5c42, transparent);
  }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="screen.js"></script>
</body>
</html>
