<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#211b14">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/shared/native-feel.css">
<script type="module" src="/shared/pwa.js"></script>
<title>At hand</title>
<link rel="stylesheet" href="/shared/ledger.css">
<link rel="stylesheet" href="player.css">
<link rel="stylesheet" href="/shared/player-finish.css">
</head>
<body class="player-surface player-hub">
  <div class="hub-shell">
    <main>
      <div class="hub-title">
        <div>
          <span class="hub-kicker" data-i18n="player.hub.atHand">At hand</span>
          <h1 id="hub-character-name">At hand</h1>
        </div>
        <a class="hub-portrait portrait-editor-link" id="hub-portrait"></a>
      </div>
      <section class="view-choice" id="view-choice" hidden>
        <header>
          <span class="smallcaps" data-i18n="player.hub.views">Views</span>
          <h2><span data-i18n="player.hub.chooseview">Choose a view</span> <span class="view-choice-note" data-i18n="player.hub.chooseviewNote">— Same content, different presentation.</span></h2>
        </header>
        <div class="view-shelf" id="view-shelf" aria-live="polite"></div>
      </section>
      <section class="essential-tools" id="essential-tools" hidden>
        <h2 data-i18n="player.hub.essentials">Everyday tools</h2>
        <div class="essential-actions" id="essential-actions"></div>
      </section>
      <section class="identity-gate" id="identity-gate" hidden>
        <h2 data-i18n="player.hub.choosepc">Choose your character</h2>
        <div id="identity-list"></div>
        <a class="create-character" href="/create/?return=/player" data-i18n="login.create">Create a character</a>
      </section>
    </main>

    <!-- Every other player page hangs a Home ribbon at the top; the hub is home,
         so its one way out is the seat chooser, kept in the corner. -->
    <a class="player-seat" href="/login">
      <span aria-hidden="true">&#8644;</span><strong data-i18n="player.hub.changeseat">Change seat</strong>
    </a>
  </div>
  <script type="module" src="player.js"></script>
</body>
</html>
